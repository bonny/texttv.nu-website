# This is a basic workflow to help you get started with Actions

name: Deploy website

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches:
      - main
    paths:
      - "texttv.nu/**"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # PHPStan på webbsajten (tools/phpstan/website.neon, samma som make
  # phpstan-website). Hittar den ett nytt fel blir det ingen deploy.
  phpstan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer

      - name: Installera PHPStan
        working-directory: tools/phpstan
        run: composer install --no-interaction --no-progress

      - name: PHPStan
        working-directory: tools/phpstan
        run: php -d memory_limit=1G vendor/bin/phpstan analyse -c website.neon --no-progress

  deploy:
    needs: phpstan
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    strategy:
      matrix:
        server:
          - name: "hetzner-server"
            host_secret: "HETZNER_HOST"
            username_secret: "HETZNER_USERNAME"
            key_secret: "HETZNER_KEY"

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          extensions: mbstring, intl
          ini-values: post_max_size=256M, max_execution_time=180
          tools: php-cs-fixer, phpunit

      # Används av städsteget nedan för att avgöra vad som ska finnas kvar.
      - name: Lista controllers som finns i repot
        run: |
          echo "REPO_CONTROLLERS=$(ls texttv.nu/codeigniter/application/controllers | tr '\n' ' ')" >> "$GITHUB_ENV"

      # Läses av /status (controllers/status.php). Skrivs här i stället för
      # på servern, så att commit-meddelandet inte hamnar i ett skalskript.
      - name: Skriv deploy-info
        run: |
          jq -n \
            --arg sha "$GITHUB_SHA" \
            --arg subject "$(git log -1 --format=%s)" \
            --arg at "$(TZ=Europe/Stockholm date -Iseconds)" \
            '{sha: $sha, short_sha: $sha[0:7], subject: $subject, deployed_at: $at}' \
            > texttv.nu/codeigniter/application/deploy.json

      - name: Copy files to ${{ matrix.server.name }}
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.username_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          source: "texttv.nu/"
          target: "/usr/share/nginx/"

      - name: Execute remote commands on ${{ matrix.server.name }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets[matrix.server.host_secret] }}
          username: ${{ secrets[matrix.server.username_secret] }}
          key: ${{ secrets[matrix.server.key_secret] }}
          script: |
            cd /usr/share/nginx/texttv.nu
            sudo chown -R root:root .
            # Kataloger som php-fpm (www-data) skriver i: delningsbilderna och
            # CI:s cache. Ägs av www-data i stället för 777 (2026-10-28; 777
            # här gjorde om rättningen av shares/ vid varje deploy).
            sudo chown -R www-data:www-data shares codeigniter/application/cache
            sudo chmod 755 shares codeigniter/application/cache
            sudo find shares -type f -perm /133 -exec chmod 644 {} +
            # scp kopierar bara — raderade filer ligger kvar på servern, och CI:s
            # auto-routing når en controller även utan route-rad. En borttagen
            # controller blir alltså kvar live om den inte raderas här.
            #
            # Detta var tidigare en handskriven rm-lista, vilket bet oss
            # 2026-08-02: dev.php togs bort ur repot men låg kvar och svarade
            # 200 på /dev/search och /dev/updated. Nu jämförs i stället mot vad
            # repot faktiskt innehåller, så listan underhåller sig själv.
            REPO_CONTROLLERS="${{ env.REPO_CONTROLLERS }}"
            if [ -z "$REPO_CONTROLLERS" ]; then
              echo "REPO_CONTROLLERS tom — hoppar över städning (raderar hellre inget än allt)."
            else
              cd /usr/share/nginx/texttv.nu/codeigniter/application/controllers
              for f in *.php; do
                case " $REPO_CONTROLLERS " in
                  *" $f "*) ;;
                  *) echo "Raderar controller som inte finns i repot: $f"; sudo rm -f "$f" ;;
                esac
              done
            fi
