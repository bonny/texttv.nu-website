# Auto-laddas av `docker compose up` för LOKAL utveckling. Ändringar ovanpå
# compose.yaml:
#   * Exponerar portar på 127.0.0.1 (namespacade för att inte krocka med
#     andra projekt — jfr brottsplatskartan 8350/33012)
#   * Bind-mountar koden så du redigerar live i editorn
#   * vendor/ behålls via anonym volym (host saknar den i importer/ och skulle
#     annars skugga imagens inbakade vendor/)
#   * Dev-vänlig env: ingen opcache (snabbare iteration), mer loggning
#
# Portar:  website 8380 · importer 8381 · mariadb 33013
# Sajten:  http://localhost:8380/100

services:
  mariadb:
    ports:
      - "127.0.0.1:33013:3306"

  importer:
    ports:
      - "127.0.0.1:8381:8080"
    environment:
      PHP_OPCACHE_ENABLE: "0"
      LOG_OUTPUT_LEVEL: info
    volumes:
      - ./importer:/var/www/html
      - /var/www/html/vendor          # anonym volym — behåll imagens vendor/

  scheduler:
    environment:
      PHP_OPCACHE_ENABLE: "0"
    volumes:
      - ./importer:/var/www/html
      - /var/www/html/vendor

  init:
    volumes:
      - ./importer:/var/www/html
      - /var/www/html/vendor

  website:
    ports:
      - "127.0.0.1:8380:8080"
    environment:
      # OPcache PÅ (som prod). CI:s bundlade core/URI.php avger en PHP 8.2
      # compile-time-warning ("AllowDynamicProperties has no effect") som med
      # opcache av läcker in i varje API-svar (ogiltig JSON för apparna). Med
      # opcache på kompileras framework-filerna en gång → warningen tystnar,
      # precis som på prod. validate_timestamps + freq=0 → dina kodändringar
      # läses ändå om direkt (ingen rebuild behövs).
      PHP_OPCACHE_ENABLE: "1"
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      PHP_OPCACHE_REVALIDATE_FREQ: "0"
      LOG_OUTPUT_LEVEL: info
    volumes:
      - ./texttv.nu:/var/www/html
